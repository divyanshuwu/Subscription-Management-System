name: Brightloop quality gates
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: brightloop
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: brightloop_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U brightloop' --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=moderate
      - run: npm run test:coverage
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://brightloop:test-only-password@127.0.0.1:5432/brightloop_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: npm run test:local-ui
      - run: npm run test:acceptance
      - run: npm run test:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-evidence
          path: docs/evidence/
