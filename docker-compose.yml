services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brightloop
      POSTGRES_PASSWORD: brightloop_local
      POSTGRES_DB: brightloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - brightloop_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  brightloop_data:
